<body>
  <canvas id="webgl" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>
  <main id="app" class="app-shell">
    <header class="top-hud is-city-compact" data-hud-mode="city" aria-label="Состояние персонажа">
      <div class="th-frame">
        <div class="th-id">
          <div class="hero-portrait-shell top-portrait" data-open-feature="profile" role="button" tabindex="0" aria-label="Персонаж"><span id="class-sigil" class="hero-sigil">◇</span></div>
          <div class="th-level" id="level" aria-label="Уровень">1</div>
          <div class="th-name"><strong id="hello">Загрузка…</strong><div class="th-sub"><small id="class-name">Путешественник</small></div></div>
          <div class="th-btns">
            <button type="button" class="top-icon" data-open-feature="mail" aria-label="Почта"><img class="ui-icon ui-icon-mail" src="/art/ui/v1/mail-128.webp" srcset="/art/ui/v1/mail-128.webp 1x, /art/ui/v1/mail-256.webp 2x" width="22" height="22" alt="" aria-hidden="true"></button>
            <button type="button" class="top-icon" data-nav-jump="more" aria-label="Настройки"><img class="ui-icon ui-icon-settings" src="/art/ui/v1/settings-128.webp" srcset="/art/ui/v1/settings-128.webp 1x, /art/ui/v1/settings-256.webp 2x" width="22" height="22" alt="" aria-hidden="true"></button>
            <button id="sound-toggle" type="button" class="top-icon" aria-label="Звук" aria-pressed="false"><svg class="ui-icon sound-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path class="sound-wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="sound-off" d="M16 9l5 6M21 9l-5 6"/></svg></button>
            <button id="fullscreen" type="button" class="top-icon" aria-label="Полный экран"><img class="ui-icon ui-icon-maximize" src="/art/ui/v1/maximize-128.webp" srcset="/art/ui/v1/maximize-128.webp 1x, /art/ui/v1/maximize-256.webp 2x" width="22" height="22" alt="" aria-hidden="true"></button>
          </div>
        </div>
        <div class="th-bars" hidden>
          <div class="top-bar cp"><span>CP</span><div class="top-bar-track"><i id="cp-fill"></i><b id="cp-text">0 / 1</b></div></div>
          <div class="top-bar hp"><span>HP</span><div class="top-bar-track"><i id="hp-fill"></i><b id="hp-text">0 / 1</b></div></div>
          <div class="top-bar mp"><span>MP</span><div class="top-bar-track"><i id="mp-fill"></i><b id="mp-text">0 / 1</b></div></div>
        </div>
        <div class="top-resources">
          <div class="top-res"><img class="ui-icon ui-icon-coin" src="/art/ui/v1/coin-128.webp" srcset="/art/ui/v1/coin-128.webp 1x, /art/ui/v1/coin-256.webp 2x" width="30" height="30" alt="" aria-hidden="true"><strong id="gold" aria-label="Адена">0</strong><button type="button" class="resource-plus" data-open-feature="shop" aria-label="Пополнить: Адена">+</button></div>
          <div class="top-res"><img class="ui-icon ui-icon-gem" src="/art/l2/icon-etc_lesser_potion_blue_i00-128.webp" width="30" height="30" alt="" aria-hidden="true"><strong id="moonDew" aria-label="Лунная роса">0</strong><button type="button" class="resource-plus" data-open-feature="exchange" aria-label="Пополнить: Лунная роса">+</button></div>
          <div class="top-res"><img class="luck-coin-icon" src="/art/world/v1/currency/coin-of-luck-128.webp" width="30" height="30" alt="" aria-hidden="true"><strong id="luck-coins" aria-label="Монеты удачи">0</strong><button type="button" class="resource-plus" data-open-feature="shop" aria-label="Пополнить: Монеты удачи">+</button></div>
          <div class="top-res"><img class="ui-icon ui-icon-pickaxe" src="/art/ui/v1/ore-128.webp" srcset="/art/ui/v1/ore-128.webp 1x, /art/ui/v1/ore-256.webp 2x" width="30" height="30" alt="" aria-hidden="true"><strong id="ore" aria-label="Руда">0</strong><i></i></div>
        </div>
        <div class="th-foot" hidden>
          <div class="th-charges" id="vit-cells" aria-label="Заряды Vitality"><i></i><i></i><i></i></div>
          <div class="th-thin">
            <div class="top-bar exp"><span>EXP</span><div class="top-bar-track"><i id="xp-fill"></i><b id="xp-text"></b></div></div>
            <div class="top-bar vit"><span>VIT</span><div class="top-bar-track"><i id="vit-fill"></i><b id="vit-text"></b></div></div>
          </div>
        </div>
      </div>
    </header>
    <section id="active-quest" class="active-quest" hidden aria-label="Текущее задание"><button type="button" id="active-quest-details"></button><button type="button" id="active-quest-go">К цели →</button></section>
    <section id="city" class="city-host" data-tab-panel="city" aria-label="Город"></section>
    <section class="section-head" data-tab-panel="features"><div><div id="tab-hint" class="eyebrow"></div><h2 id="tab-title">Куда идём?</h2></div></section>
    <section id="game-grid" class="game-grid" data-tab-panel="features"></section>
    <div id="status" class="status">Подключаем Telegram…</div>
