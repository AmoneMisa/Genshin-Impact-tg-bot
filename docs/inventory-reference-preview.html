<div id="l2-inventory-preview" class="viz-dotted-background">
<style>
#l2-inventory-preview{padding:18px 0;color:#e9dec2;font:14px Arial,sans-serif;--gold:#a89055;--panel:#141412;--cell:#1d211e}#l2-inventory-preview *{box-sizing:border-box}#l2-inventory-preview button,#l2-inventory-preview input{font:inherit;color:inherit}#l2-inventory-preview button{cursor:pointer}#l2-inventory-preview .window{background:linear-gradient(#24231e,#111310);border:1px solid var(--gold);border-radius:6px;max-width:680px;margin:auto;box-shadow:0 8px 30px #0007;padding:10px}#l2-inventory-preview header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #655b3e;padding:3px 5px 12px;gap:8px}#l2-inventory-preview h2{font:22px Georgia,serif;margin:0;color:#f0db9f}#l2-inventory-preview .muted{color:#ada991}#l2-inventory-preview .layout{display:grid;grid-template-columns:156px minmax(0,1fr);gap:12px;margin-top:12px}#l2-inventory-preview .gear{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start;background:#10120f;padding:6px;border:1px solid #514b37}#l2-inventory-preview .slot{aspect-ratio:1;border:1px solid #514e3e;border-radius:6px;background:var(--cell);padding:3px;position:relative;min-width:0}#l2-inventory-preview .slot img{width:100%;height:100%;object-fit:contain;image-rendering:auto}#l2-inventory-preview .slot.empty img{opacity:.18;filter:grayscale(1)}#l2-inventory-preview .slot.active{border-color:#e5bf68;box-shadow:inset 0 0 0 1px #e5bf68}#l2-inventory-preview .slot.shadow{border-color:#ed77b1}#l2-inventory-preview .slot span{position:absolute;right:3px;bottom:2px;color:#fff;font-size:11px;text-shadow:0 1px 3px #000}#l2-inventory-preview nav{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}#l2-inventory-preview nav button{border:1px solid #5b5239;border-radius:6px;padding:6px;background:#22231d;font-size:12px}#l2-inventory-preview nav button[aria-selected=true]{background:#554423;color:#ffdf9d;border-color:#b8954e}#l2-inventory-preview .bag{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;background:#0d100e;padding:4px;border:1px solid #514b37}#l2-inventory-preview .detail{display:flex;align-items:center;gap:12px;margin-top:12px;border-top:1px solid #504936;padding:12px 4px;min-height:80px}#l2-inventory-preview .detail img{width:48px;height:48px;border:1px solid #a38a4b;border-radius:6px}#l2-inventory-preview .detail strong{display:block;color:#eddaa4;margin-bottom:6px}#l2-inventory-preview .detail p{margin:0;color:#aaa895;font-size:12px;line-height:1.5}#l2-inventory-preview footer{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #504936;padding-top:10px}#l2-inventory-preview .actions{display:flex;gap:5px}#l2-inventory-preview .action{width:40px;height:40px;background:#27271e;border:1px solid #827044;border-radius:6px;padding:4px}#l2-inventory-preview .action img{width:100%;height:100%;object-fit:contain}#l2-inventory-preview .wallet{display:grid;gap:5px;text-align:right;font-variant-numeric:tabular-nums}#l2-inventory-preview .wallet img{width:20px;height:20px;vertical-align:middle;margin-right:6px}#l2-inventory-preview .status{margin:9px 2px 0;color:#c7b77e;min-height:16px;font-size:12px}#l2-inventory-preview .close{border:0;background:transparent;font-size:24px;padding:0 3px}#l2-inventory-preview .search{width:100%;padding:7px 8px;border:1px solid #6b5d3d;background:#141713;border-radius:6px;margin-bottom:7px}#l2-inventory-preview [hidden]{display:none!important}
@media(max-width:560px){#l2-inventory-preview .layout{grid-template-columns:1fr;gap:10px}#l2-inventory-preview .gear{grid-template-columns:repeat(6,minmax(0,1fr))}#l2-inventory-preview .bag{grid-template-columns:repeat(6,minmax(0,1fr))}#l2-inventory-preview .window{padding:10px}#l2-inventory-preview nav button{flex:1 1 29%;padding:7px 4px}#l2-inventory-preview footer{align-items:flex-start}#l2-inventory-preview .wallet{font-size:12px}#l2-inventory-preview .action{width:36px;height:36px}}
#l2-inventory-preview .gear .slot{aspect-ratio:auto;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 2px}#l2-inventory-preview .gear .slot img{width:36px;height:36px}#l2-inventory-preview .gear .slot-label{position:static;font:10px/1.3 Arial,sans-serif;color:#c9c2a7;white-space:nowrap}#l2-inventory-preview .gear .slot span{top:2px;bottom:auto}#l2-inventory-preview .gear{align-self:start}#l2-inventory-preview .bag{align-content:start}#l2-inventory-preview .gear .empty{background:#141813}
#l2-inventory-preview .wallet{margin-left:auto}#l2-inventory-preview .discard{flex-shrink:0;margin-left:4px;border-color:#8c6154}#l2-inventory-preview .discard canvas{display:block;width:100%;height:100%}#l2-inventory-preview .gear .armor-upper,#l2-inventory-preview .gear .armor-lower{border-color:#ad9356;background:#343020}#l2-inventory-preview .gear .armor-upper::after{content:'';position:absolute;right:-6px;top:27px;width:6px;height:2px;background:#ad9356;z-index:1}
</style>

['Necklace of Valakas','icon-accessory_necklace_of_valakas_i00','Экипировка','Эпическая бижутерия · Ожерелье',''],
['Earring of Antharas','icon-accessory_earring_of_antaras_i00','Экипировка','Эпическая бижутерия · Серьга',''],
['Arcana Sigil','icon-arcana_sigil_i00','Экипировка','S · Сигиль',''],
['Soul Cloak of Freya','branchsys2-br_freya_cloak_i00','Экипировка','S84 · Плащ',''],
['Купон на соски','icon-etc_shining_quiver_i00','Расходники','Выбор грейда и типа при использовании','×2']
];
let selected=0,category='Все',search='';
const cats=['Все','Экипировка','Расходники','Материалы','Прочее','Квесты'];
const equipped=new Set([0,1,2,10,11,12,13,14,15,16]);
const gear=[['Плащ',16],['Голова',12],['Рубашка',null,'shirt'],['Л. ухо',14],['Шея',13],['П. ухо',14],['Верх',1],['Низ',null,'icon-armor_t90_ul_i00'],['Л. рука',15],['Оружие',0],['Перчатки',10],['Сапоги',11],['Л. кольцо',2],['Пояс',null,'belt'],['П. кольцо',null,'icon-accessory_ring_of_baium_i00'],['Тату 1',null,'tattoo-str'],['Тату 2',null,'tattoo-int'],['Тату 3',null,'tattoo-dex']];
const img=key=>art[key];
function slot(item,index,label,empty=false){const b=document.createElement('button');b.type='button';b.className='slot '+(item[5]||'')+(empty?' empty':'')+(selected===index&&!empty?' active':'');b.setAttribute('aria-label',label||item[0]);b.setAttribute('aria-pressed',String(selected===index&&!empty));b.dataset.tooltip=label||item[0];b.innerHTML='<img alt="" src="'+img(item[1])+'">'+(!empty&&item[4]?'<span>'+item[4]+'</span>':'');b.onclick=()=>{if(empty)return;selected=index;render();};return b;}
function render(){
root.querySelector('nav').replaceChildren(...cats.map(c=>{const b=document.createElement('button');b.textContent=c;b.setAttribute('aria-selected',String(c===category));b.onclick=()=>{category=c;render();};return b;}));
root.querySelector('.gear').replaceChildren(...gear.map(([label,i,key])=>{const empty=i==null;const item=empty?[label,key]:items[i];const b=slot(item,i,label+': '+(empty?(label==='Низ'?'Занят цельной бронёй':'Слот свободен'):item[0]),empty);const caption=document.createElement('small');caption.className='slot-label';caption.textContent=label;b.append(caption);if(label==='Верх')b.classList.add('armor-upper');if(label==='Низ')b.classList.add('armor-lower');return b;}));
const filtered=items.map((it,i)=>[it,i]).filter(([it,i])=>!equipped.has(i)&&(category==='Все'||it[2]===category)&&it[0].toLowerCase().includes(search.toLowerCase()));
const cells=filtered.map(([it,i])=>slot(it,i));while(cells.length<28){const b=document.createElement('div');b.className='slot';b.setAttribute('aria-hidden','true');cells.push(b);}root.querySelector('.bag').replaceChildren(...cells);
const it=items[selected];root.querySelector('[data-detail-icon]').src=img(it[1]);root.querySelector('[data-detail-name]').textContent=it[0];root.querySelector('[data-detail-text]').textContent=it[3];root.querySelector('[data-count]').textContent=(items.length-equipped.size)+' / 100';
}
const actions=[['Кристаллизация','crystallize'],['Аукцион','ui-hammer'],['Крафт','craft']];
root.querySelector('.actions').replaceChildren(...actions.map(([name,key])=>{const b=document.createElement('button');b.className='action';b.setAttribute('aria-label',name);b.dataset.tooltip=name;b.innerHTML='<img alt="" src="'+img(key)+'">';b.onclick=()=>root.querySelector('.status').textContent=name+' · '+items[selected][0]+' (превью)';return b;}));
const trash=root.querySelector('.discard canvas').getContext('2d');trash.strokeStyle='#d8c690';trash.lineWidth=2;trash.fillStyle='#4e534e';trash.fillRect(8,10,16,17);trash.strokeRect(8,10,16,17);trash.fillStyle='#a6aaa1';trash.fillRect(6,7,20,3);trash.strokeRect(6,7,20,3);trash.strokeRect(12,4,8,3);for(const x of [12,16,20]){trash.beginPath();trash.moveTo(x,13);trash.lineTo(x,24);trash.stroke();}
root.querySelector('.discard').onclick=()=>root.querySelector('.status').textContent='Выбросить · '+items[selected][0]+' (превью)';
root.querySelectorAll('[data-art]').forEach(el=>el.src=img(el.dataset.art));root.querySelector('.search').oninput=e=>{search=e.target.value;render();};root.querySelector('.close').onclick=()=>root.querySelector('.status').textContent='Превью инвентаря';render();
})();
</script>
</div>
