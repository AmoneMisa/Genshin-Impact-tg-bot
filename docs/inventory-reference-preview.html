#l2-inventory-preview .wallet{margin-left:auto}#l2-inventory-preview .discard{flex-shrink:0;margin-left:4px;border-color:#8c6154}#l2-inventory-preview .discard canvas{display:block;width:100%;height:100%}#l2-inventory-preview .gear .armor-upper,#l2-inventory-preview .gear .armor-lower{border-color:#ad9356;background:#343020}#l2-inventory-preview .gear .armor-upper::after{content:'';position:absolute;right:-6px;top:27px;width:6px;height:2px;background:#ad9356;z-index:1}

function render(){

const dialog=root.querySelector('.item-dialog');let confirmation=null;
function openItem(action=null){const item=items[selected];confirmation=action;dialog.querySelector('h2').textContent=action||'Предмет';dialog.querySelector('.dialog-item img').src=img(item[1]);dialog.querySelector('.dialog-item strong').textContent=item[0];dialog.querySelector('.dialog-item p').textContent=item[3];dialog.querySelector('.confirm-text').textContent=action==='Кристаллизация'?'Разбить предмет на кристаллы? Предмет будет уничтожен.':action==='Выбросить'?'Выбросить этот предмет?':'';dialog.querySelector('.confirm-text').hidden=!action;dialog.querySelector('.dialog-actions').hidden=!action;if(!dialog.open)dialog.showModal();}
