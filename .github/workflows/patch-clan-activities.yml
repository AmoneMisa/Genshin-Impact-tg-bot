name: Patch clan shop cooldown

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
    paths:
      - .github/workflows/patch-clan-activities.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-webgl
      - name: Fix never-purchased cooldown state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('miniapp/clanActivities.js')
          text = path.read_text()
          old_state = "  const lastShopAt = Math.max(0, number(member?.lastShopAt));\n  const shopCooldownRemainingMs = Math.max(0, lastShopAt + CLAN_SHOP_COOLDOWN - now);"
          new_state = "  const lastShopAt = Math.max(0, number(member?.lastShopAt));\n  const shopCooldownRemainingMs = lastShopAt > 0\n    ? Math.max(0, lastShopAt + CLAN_SHOP_COOLDOWN - now)\n    : 0;"
          assert old_state in text, 'shop state cooldown anchor not found'
          text = text.replace(old_state, new_state, 1)

          old_buy = "  const nextAllowed = Math.max(0, number(member.lastShopAt)) + CLAN_SHOP_COOLDOWN;\n  if (nextAllowed > now) {\n    return { ok: false, reason: 'shop_cooldown', cooldownRemainingMs: nextAllowed - now };\n  }"
          new_buy = "  const lastShopAt = Math.max(0, number(member.lastShopAt));\n  const nextAllowed = lastShopAt > 0 ? lastShopAt + CLAN_SHOP_COOLDOWN : 0;\n  if (nextAllowed > now) {\n    return { ok: false, reason: 'shop_cooldown', cooldownRemainingMs: nextAllowed - now };\n  }"
          assert old_buy in text, 'shop buy cooldown anchor not found'
          text = text.replace(old_buy, new_buy, 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniapp/clanActivities.js
          git diff --cached --check
          git commit -m "fix: treat zero clan shop timestamp as unused"
          git push origin HEAD:feature/telegram-miniapp-webgl
