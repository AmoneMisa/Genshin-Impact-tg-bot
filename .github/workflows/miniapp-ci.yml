name: CI

# Runs only for pushes to master (and on demand). Tests first; when they pass,
# the Docker image is built here on GitHub, smoke-tested and published to
# GHCR, so the server only pulls it: `docker compose pull && docker compose up -d`.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24          # current Node.js LTS; matches the Dockerfile and .nvmrc
  MONGO_IMAGE: mongo:8.0    # current MongoDB LTS line; matches docker-compose.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }} (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # config.js (token, admin id) is secret and git-ignored; production builds it from the
      # environment (docker/entrypoint.sh). Modules that load the bot need one to be imported.
      - name: Create a dummy config.js for the tests
        run: |
          echo 'export let token = "123456:ci-test-token";' > config.js
          echo 'export let myId = 1;' >> config.js
          echo 'export let giantBombApiKey = "";' >> config.js

      - name: Run tests
        run: npm test

      - name: Check syntax of every module
        run: |
          node --check miniapp-entry.js
          node --check index.js
          find miniapp webapp -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: genshin-tg-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - entrypoint refuses to start without a token
        run: |
          if docker run --rm genshin-tg-bot:ci true; then
            echo "expected a missing BOT_TOKEN to stop the container"; exit 1
          fi

      - name: Smoke test - Mini App server boots against MongoDB
        run: |
          docker network create ci
          docker run -d --name mongo --network ci "$MONGO_IMAGE"
          docker run -d --name web --network ci -p 8080:8080 \
            -e BOT_TOKEN=1:ci -e ADMIN_ID=1 -e MONGO_URL=mongodb://mongo:27017/ci \
            genshin-tg-bot:ci \
            node -e "import('./miniapp/chatSettingsServer.js').then(m => m.default())"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs -o /dev/null http://127.0.0.1:8080/
          curl -fs -o /dev/null http://127.0.0.1:8080/models/manifest.json
          docker logs web | tail -20

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # One plain manifest per version (no attestation sub-manifests), so
          # the retention step below can delete old versions without breaking
          # the ones it keeps.
          provenance: false
          sbom: false

      - name: Package name
        id: package
        # GHCR stores container packages under a lowercase name.
        run: echo "name=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Delete old image versions from GHCR
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.package.outputs.name }}
          package-type: container
          # The newest builds stay available for rollback; latest is always one of them.
          min-versions-to-keep: 10

  deploy:
    # Only pushes to master deploy; manual runs of the workflow build and test but do not ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: image
    environment: Production
    steps:
      - name: Pull the new image and restart the bot on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust-on-first-use: the host key is fetched on each run. Pin it under a
          # secret/variable if you want a hard check.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/genshin-bot && docker compose pull bot && docker compose up -d bot && docker compose ps bot'
