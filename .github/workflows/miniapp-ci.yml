name: Mini App CI

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Mini App syntax
        run: |
          node --check miniapp-entry.js
          node --check miniapp/server.js
          node --check miniapp/telegramAuth.js
          node --check miniapp/state.js
          node --check miniapp/chest.js
          node --check miniapp/gacha.js
          node --check webapp/app.js
          node --check webapp/chest.js
          node --check webapp/gacha.js
          node --check webapp/renderer.js
