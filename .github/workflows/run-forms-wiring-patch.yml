name: Run forms wiring patch

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
    paths:
      - .github/scripts/patch-forms-wiring.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-webgl
      - name: Apply forms wiring patch
        run: python .github/scripts/patch-forms-wiring.py
      - name: Commit forms wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniapp/server.js miniapp/state.js webapp/app.js webapp/index.html .github/workflows/miniapp-ci.yml
          git diff --cached --check
          git commit -m "feat: wire profile forms into Mini App"
          git push origin HEAD:feature/telegram-miniapp-webgl
