name: Run exchange patch

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
    paths:
      - .github/scripts/patch-exchange.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-webgl
      - name: Apply exchange patch
        run: python .github/scripts/patch-exchange.py
      - name: Commit exchange wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniapp/server.js miniapp/state.js webapp/app.js webapp/index.html
          git diff --cached --check
          git commit -m "feat: wire crystal exchange into Mini App"
          git push origin HEAD:feature/telegram-miniapp-webgl
