name: Run arcade reset patch

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
    paths:
      - .github/scripts/patch-arcade-reset.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-webgl
      - name: Apply arcade reset patch
        run: python .github/scripts/patch-arcade-reset.py
      - name: Commit arcade reset wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniapp/server.js webapp/arcade.js webapp/arcade.css
          git diff --cached --check
          git commit -m "feat: wire legacy arcade resets into Mini App"
          git push origin HEAD:feature/telegram-miniapp-webgl
