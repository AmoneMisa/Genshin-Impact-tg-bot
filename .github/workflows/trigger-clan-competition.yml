name: Trigger clan competition patch

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
    paths:
      - .github/workflows/trigger-clan-competition.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-webgl
      - name: Trigger existing clan competition patch
        run: |
          printf '\n# triggered by continuation workflow\n' >> .github/workflows/patch-clan-competition.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/patch-clan-competition.yml
          git commit -m "ci: trigger clan competition wiring"
          git push origin HEAD:feature/telegram-miniapp-webgl
