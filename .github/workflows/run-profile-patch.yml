name: Run player profile patch

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
    paths:
      - .github/scripts/patch-profile.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-webgl
      - name: Apply server patch
        run: python .github/scripts/patch-profile.py
      - name: Commit server wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniapp/server.js
          git diff --cached --check
          git commit -m "feat: wire player profile API into Mini App"
          git push origin HEAD:feature/telegram-miniapp-webgl
