name: Run legacy debt patch

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
    paths:
      - .github/scripts/patch-legacy-debt.py
      - .github/scripts/fix-legacy-debt-output.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-webgl
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply legacy debt patch
        run: |
          python .github/scripts/patch-legacy-debt.py
          python .github/scripts/fix-legacy-debt-output.py

      - name: Verify patch
        run: |
          npm test
          node --check callbacks/game/arena/arena.js
          node --check callbacks/game/player/showInventory.js
          node --check functions/game/player/useHealPotion.js
          node --check functions/game/player/userDealDamage.js
          node --check callbacks/game/player/userSkillsCallback.js
          node --check functions/game/arena/arenaInventory.js
          git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add callbacks/game/arena/arena.js callbacks/game/player/showInventory.js .github/workflows/miniapp-ci.yml
          git commit -m "fix: harden legacy arena and inventory callbacks"
          git push origin HEAD:feature/telegram-miniapp-webgl
