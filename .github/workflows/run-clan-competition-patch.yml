name: Run clan competition patch

on:
  push:
    branches:
      - feature/telegram-miniapp-webgl
    paths:
      - .github/scripts/patch-clan-competition.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-webgl
      - name: Apply patch
        run: python .github/scripts/patch-clan-competition.py
      - name: Commit runtime patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniapp/clan.js miniapp/server.js miniapp/clanCompetition.js webapp/clan.js webapp/clan.css
          git diff --cached --check
          git commit -m "feat: wire clan PvP and wars into Mini App"
          git push origin HEAD:feature/telegram-miniapp-webgl
